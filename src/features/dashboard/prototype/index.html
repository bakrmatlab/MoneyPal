10px}.c .archive{border-color:#9cac88;color:#4f6044}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:5;background:#fff;color:#15200c;border:1px solid #bcc9ac;border-radius:14px;padding:10px;box-shadow:0 8px 35px #0003;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px)}.switcher button{border:0;background:#eef3e6;padding:10px 13px;border-radius:8px;font-size:12px}.switcher .variant-button[aria-pressed=true]{background:#182010;color:#d2ff70}.switcher-label{font-size:10px;color:#66735a;white-space:nowrap}.switcher-nav{display:flex;gap:5px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.dark.a{background:#131711;color:#eef3e7}.dark.a .sidebar,.dark.a .wallet{background:#1d2419;border-color:#35412b}.dark.a .nav span,.dark.a .sub,.dark.a .sample,.dark.a .wallet-meta,.dark.a .notice{color:#b1bea3}.dark.a .nav .selected{background:#303f22;color:#d1ff6e}.dark.a .topbar,.dark.a .overview-a,.dark.a .archive,.dark.a .account{border-color:#35412b}.dark.a .budget{background:#26321e}.dark.a .budget-footer,.dark.a .balance-caption{color:#bace9f}.dark.a .quiet,.dark.a .actions button{border-color:#4d5f3d;color:#dbe6ce}.dark.a .count,.dark.a .avatar{background:#35462a}.light.b{background:#f4f6ef;color:#1b2414}.light.b .sidebar{background:#fff}.light.b .hero-b{background:#e5eed8}.light.b .wallet,.light.b .budget{background:white}.light.b .budget-values strong{color:#456415}.light.b .nav .selected{background:#e4efd4;color:#31461a}.light.b .eyebrow{color:#4c6b20}.light.b .nav span,.light.b .sub,.light.b .sample,.light.b .wallet-meta,.light.b .notice{color:#626f54}.light.b .hero-bottom,.light.b .budget-footer{color:#526541}.light.b .quiet{color:#364827}.light.b .wallet,.light.b .overview-b,.light.b .budget,.light.b .sidebar,.light.b .topbar{border-color:#becbac}.dark.c{background:#171e12;color:#f0f5e8}.dark.c .topbar,.dark.c .section-head,.dark.c .wallet-row,.dark.c .archive{border-color:#70845a}.dark.c .hero-c{color:#11170d}.dark.c .table-labels{background:#2a3820;color:#c0d4ab}.dark.c .quiet,.dark.c .wallet-row .actions button{color:#d6e6c5}.dark.c .archive{color:#b6c9a3}.dark.c .sub,.dark.c .sample,.dark.c .notice{color:#afc39d}.dark.c .count{color:#c9ddaF}@media(min-width:1600px){.sidebar{left:calc((100vw - 1600px)/2)}}@media(max-width:1050px){.sidebar{width:180px;padding:28px 17px}.content{margin-left:180px;padding-left:28px;padding-right:28px}.wallets{grid-template-columns:repeat(2,minmax(0,1fr))}.wallet:last-child{grid-column:1/-1}.overview-a{gap:20px}.balance{font-size:50px}.b .balance{font-size:60px}.c .sidebar{gap:20px;padding:18px 20px}.c .account{display:none}.c .nav span{padding:8px}.wallet-row{grid-template-columns:1fr 1fr}.wallet-row .actions{grid-column:1/-1;justify-content:start}.table-labels span:last-child{display:none}.table-labels{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.sidebar{position:static;width:auto;padding:18px 20px;border-right:0;border-bottom:1px solid #dfe3da;gap:0}.brand{font-size:21px}.nav{display:flex;margin-top:20px;overflow-x:auto;gap:4px;padding-bottom:2px}.nav span{white-space:nowrap;padding:9px 11px;font-size:11px}.nav svg{display:none}.account{display:none}.content,.b .content{margin:0;padding:0 20px 155px}.topbar{height:60px}.sample{font-size:9px;letter-spacing:.5px}.quiet{padding:7px 8px;font-size:10px}.title-row{margin:28px 0 22px;align-items:start}h1{font-size:28px}.sub{font-size:12px}.primary{padding:11px 14px;font-size:10px}.overview-a,.overview-b,.overview-c{grid-template-columns:1fr}.overview-a{padding:0 0 24px;gap:24px}.balance{font-size:57px}.budget{padding:22px}.wallets{grid-template-columns:1fr}.wallet:last-child{grid-column:auto}.wallet{padding:22px}.wallet-amount{margin-top:22px}.actions button{font-size:11px;padding:9px 12px}.b .hero-b,.b .budget{padding:25px}.b .budget{border-left:0;border-top:1px solid #36402c}.b .balance{font-size:61px}.b .title-row{margin-top:25px}.section-head{margin-top:28px}.c .sidebar{display:block;padding:18px 20px}.c .nav{margin-top:18px}.c .content{padding:0 20px 155px}.c h1{font-size:36px;letter-spacing:-1.5px}.c .title-row{display:block}.c .title-row .primary{margin-top:18px}.hero-c,.c .budget{padding:25px}.hero-c .balance{font-size:57px;letter-spacing:-3px}.technical{gap:15px;font-size:9px}.wallet-row{padding:22px 8px;gap:18px}.wallet-row .wallet-amount{font-size:24px;text-align:right}.table-labels{padding:12px 8px}.c h2{font-size:16px}.switcher{bottom:12px;flex-wrap:wrap;justify-content:center;width:350px;gap:7px}.switcher-label{flex-basis:100%;text-align:center}.switcher .variant-button{font-size:10px;padding:9px}.notice{font-size:10px}.archive{font-size:11px}}@media(prefers-reduced-motion:no-preference){button,a{transition:background .15s,color .15s}}
</style></head><body>
<div id="app"></div>
<div class="switcher" aria-label="Design experiment controls"><span class="switcher-label">PROTOTYPE · SAMPLE DATA · <span id="current-label"></span></span><button id="previous" aria-label="Previous design">←</button><div class="switcher-nav"><button class="variant-button" data-variant="a">A / Robinhood</button><button class="variant-button" data-variant="b">B / Balanced</button><button class="variant-button" data-variant="c">C / Marathon</button></div><button id="next" aria-label="Next design">→</button></div><div id="announce" class="sr-only" aria-live="polite"></div>
<script>
// Throwaway visual experiment: same dashboard data, three structurally different layouts.
// Standalone preview intentionally bypasses production routing/auth. No persistence or mutations.
const wallets=[{name:'Everyday',amount:'4,250.00',color:'#97b852'},{name:'Savings',amount:'8,600.00',color:'#819cce'},{name:'Travel',amount:'2,000.00',color:'#ce9d7d'}];
const names={a:'Robinhood-led',b:'Balanced mix',c:'Marathon-led'};const params=new URLSearchParams(location.search);let variant=['a','b','c'].includes(params.get('variant'))?params.get('variant'):'b';let theme=params.get('theme')||'default';
function sidebar(){return `<aside class="sidebar"><div class="brand"><span class="mark">↗</span>MoneyPal</div><nav class="nav" aria-label="Preview navigation">${['Dashboard','Transactions','E-Transfers','Analytics','Categories','Preferences'].map((x,i)=>`<span class="${i===0?'selected':''}" ${i===0?'aria-current="page"':''}><svg viewBox="0 0 20 20" fill="none" stroke="currentColor"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M3 10h14M10 3v14"/></svg>${x}</span>`).join('')}</nav><div class="account"><span class="avatar">JD</span>Jamie Demo</div></aside>`}
function budget(){return `<div class="eyebrow">Monthly budget · October</div><div class="budget-values"><strong>$1,280<span style="font-size:15px">.00</span></strong><span class="muted" style="font-size:12px">of $2,000.00</span></div><div class="track" role="progressbar" aria-label="Monthly budget spent" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div><div class="budget-footer">$720.00 remaining · 64% used</div><div class="actions"><button disabled>Edit budget</button></div>`}
function actions(){return `<div class="actions">${['Deposit','Withdraw','Transfer'].map(x=>`<button disabled>${x}</button>`).join('')}</div>`}
function cards(){return `<div class="wallets">${wallets.map(w=>`<article class="wallet"><div class="wallet-head"><span><i class="dot" style="background:${w.color}"></i>${w.name}</span><span aria-label="Wallet settings preview">⚙</span></div><div class="wallet-amount">$${w.amount}</div><div class="wallet-meta">USD · Active</div>${actions()}</article>`).join('')}</div>`}
function variantA(){return `<div class="overview-a"><section><div class="eyebrow">Total balance</div><div class="balance"><span class="currency">$</span>14,850.00</div><div class="balance-caption">Across 3 active wallets</div></section><section class="budget">${budget()}</section></div><div class="section-head"><h2>Your wallets <span class="count">3</span></h2><span class="mono muted">USD</span></div>${cards()}`}
function variantB(){return `<div class="overview-b"><section class="hero-b"><div class="eyebrow">01 / Total balance</div><div class="balance"><span class="currency">$</span>14,850.00</div><div class="hero-bottom"><span>3 active wallets</span><span class="mono">USD</span></div></section><section class="budget">${budget()}</section></div><div class="section-head"><div><div class="eyebrow" style="margin-bottom:8px">02 / Wallets</div><h2>Your money, organized.</h2></div><span class="count">03 wallets</span></div>${cards()}`}
function variantC(){return `<div class="overview-c"><section class="hero-c"><div class="eyebrow">01 / Total balance</div><div class="balance">$14,850.00</div><div class="technical"><span>Currency / USD</span><span>Active wallets / 03</span></div></section><section class="budget">${budget()}</section></div><div class="section-head"><h2>02 / Your wallets</h2><span class="count">03 active</span></div><div class="wallet-table"><div class="table-labels"><span>Wallet / currency</span><span>Available balance</span><span>Actions</span></div>${wallets.map(w=>`<article class="wallet-row"><div><div class="wallet-head"><span><i class="dot" style="background:${w.color}"></i>${w.name}</span></div><div class="wallet-meta" style="margin-top:8px">USD · Active · Settings ⚙</div></div><div class="wallet-amount">$${w.amount}</div>${actions()}</article>`).join('')}</div>`}
function render(){document.body.className=variant+' '+(theme==='default'?'':theme);document.getElementById('app').innerHTML=`<div class="shell">${sidebar()}<main class="content"><header class="topbar"><span class="sample">DESIGN STUDY / SYNTHETIC DATA</span><div class="top-controls"><button class="quiet" id="theme-button">${(theme==='dark'||(theme==='default'&&variant==='b'))?'Light':'Dark'} theme</button></div></header><div class="title-row"><div><h1>${variant==='c'?'Money. In focus.':'Your overview'}</h1><p class="sub">Your wallets and monthly budget, at a glance.</p></div><button class="primary" disabled>+ New wallet</button></div>${variant==='a'?variantA():variant==='b'?variantB():variantC()}<div class="archive"><span>Archived wallets</span><span>Show archived ↓</span></div><p class="notice">Visual prototype only. Navigation and financial actions are inactive. All amounts are sample data.</p></main></div>`;document.getElementById('current-label').textContent=names[variant];document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===variant)));document.getElementById('announce').textContent=names[variant]+'; total balance $14,850.00; three wallets; monthly spending $1,280 of $2,000.';document.getElementById('theme-button').onclick=()=>{theme=(theme==='dark'||(theme==='default'&&variant==='b'))?'light':'dark';update()}}
function update(){const p=new URLSearchParams(location.search);p.set('variant',variant);p.set('theme',theme);history.replaceState(null,'','?'+p);render()}
function cycle(n){const keys=['a','b','c'];variant=keys[(keys.indexOf(variant)+n+3)%3];theme='default';update()}
document.getElementById('previous').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;theme='default';update()});document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable=true]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});render();
</script></body></html>
